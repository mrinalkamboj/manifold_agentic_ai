[project]
name = "agentic-developer-bootcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mrinal Kamboj", email = "mrinal.technology@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "click==8.5.0",
    "dotenv>=0.9.9",
    "fastapi==0.141.1",
    "grandalf>=0.8",
    "h11==0.16.0",
    "idna==3.19",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.12",
    "mcp<2",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "starlette==1.6.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uvicorn==0.52.4",
]

[project.scripts]
agentic-developer-bootcamp = "agentic_developer_bootcamp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
